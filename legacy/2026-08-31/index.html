<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORLANDO — Estratégia de marca, marketing e negócio</title>
<meta name="description" content="Investigamos o que trava, organizamos prioridades e projetamos marca, conteúdo, governança e infraestrutura para empresas que cresceram antes de se estruturar.">
<meta name="theme-color" content="#071A1F">
<meta property="og:title" content="ORLANDO — Estratégia de marca, marketing e negócio">
<meta property="og:description" content="Investigamos o que trava, organizamos prioridades e projetamos marca, conteúdo, governança e infraestrutura.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/simbolo-circular-teal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="has-photo-hero">
<a class="skip-link" href="#main">Pular para o conteúdo</a>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brand-mark" href="#top" aria-label="ORLANDO">
      <img src="assets/logos-detalhe/logo-branco.svg" alt="ORLANDO Marketing &amp; Branding" class="brand-mark-word">
    </a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav">
      <span class="nav-toggle-bar"></span>
      <span class="sr-only">Abrir menu</span>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="Navegação principal"></nav>
  </div>
</header>

<main id="main">

  <!-- 2. Hero — fotografia exclusiva em tela cheia, sem coleção de miniaturas -->
  <section class="hero" id="top">
    <div class="wrap hero-grid">
      <div class="hero-copy" data-reveal>
        <span class="hero-chip" id="heroChip"><i class="ph-light ph-compass" aria-hidden="true"></i> <span id="heroChipText"></span></span>
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="heroTitle" class="title-lg"></h1>
        <p class="hero-lead" id="heroLead"></p>
        <div class="hero-ctas" id="heroCtas"></div>
      </div>
    </div>
  </section>

  <!-- 3. Faixa de clientes -->
  <section class="trust-strip" id="quem-confia" data-reveal>
    <div class="wrap">
      <p class="trust-title" id="trustTitle"></p>
      <div class="trust-logos" id="trustLogos"></div>
    </div>
  </section>

  <!-- 4. Manifesto / problema -->
  <section class="section manifesto" id="manifesto" data-reveal>
    <div class="manifesto-watermark" aria-hidden="true">
      <img src="assets/logos-detalhe/detalhe-4.svg" alt="">
    </div>
    <div class="wrap manifesto-grid">
      <div class="manifesto-head">
        <p class="eyebrow" id="manifestoEyebrow"></p>
        <h2 class="title-lg" id="manifestoTitle"></h2>
      </div>
      <div class="manifesto-body-col">
        <p class="manifesto-body" id="manifestoBody"></p>
        <ul class="manifesto-points" id="manifestoPoints"></ul>
      </div>
    </div>
  </section>

  <!-- 5. Como ajudamos — quatro frentes de peso igual -->
  <section class="section section-surface frentes" id="frentes" data-reveal>
    <div class="wrap">
      <h2 class="title-lg" id="frentesTitle"></h2>
      <p class="lead frentes-intro" id="frentesIntro"></p>
      <div class="frentes-grid" id="frentesList"></div>
    </div>
  </section>

  <!-- 6. O que entregamos — três movimentos editoriais -->
  <section class="section structure" id="entregaveis" data-reveal>
    <div class="wrap">
      <h2 class="title-lg" id="deliverablesTitle"></h2>
      <p class="lead structure-intro" id="deliverablesIntro"></p>
      <div class="movements" id="deliverablesGrid"></div>
    </div>
  </section>

  <!-- 7. Trabalhos autorais e liderança -->
  <section class="section section-surface trabalhos" id="trabalhos" data-reveal>
    <div class="wrap">
      <div class="founder-grid">
        <img class="founder-photo" src="assets/matheus-orlando-founder.jpg" alt="Matheus Orlando, fundador da ORLANDO" width="900" height="1350" loading="lazy">
        <div class="founder-copy">
          <p class="eyebrow" id="founderEyebrow"></p>
          <h2 class="title-lg" id="founderTitle"></h2>
          <p class="founder-bio" id="founderBio"></p>
          <p class="founder-signature">
            <strong id="founderName"></strong>
            <span id="founderRole"></span>
          </p>
        </div>
      </div>
      <div class="portfolio-block">
        <h2 class="title-lg" id="portfolioTitle"></h2>
        <p class="lead portfolio-intro" id="portfolioIntro"></p>
        <div class="portfolio-grid" id="portfolioGrid"></div>
        <a class="portfolio-link" id="portfolioLink" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </section>

  <!-- 8. Como começamos -->
  <section class="section method" id="comeco" data-reveal>
    <div class="wrap">
      <h2 class="title-lg" id="methodTitle"></h2>
      <ol class="method-steps" id="methodSteps"></ol>
    </div>
  </section>

  <!-- 8b. Transição/fechamento — lobo ORLANDO -->
  <section class="lobo-section" id="direcao" data-reveal>
    <div class="wrap lobo-inner">
      <div class="lobo-text">
        <p class="eyebrow" id="loboEyebrow"></p>
        <h2 class="title-lg" id="loboTitle"></h2>
      </div>
    </div>
  </section>

  <!-- 9. CTA final -->
  <section class="closing" id="contato" data-reveal>
    <div class="closing-watermark" aria-hidden="true"></div>
    <div class="wrap closing-inner">
      <h2 class="title-lg" id="closingTitle"></h2>
      <p id="closingLead"></p>
      <div class="closing-ctas">
        <div id="closingCta"></div>
        <p class="closing-email" id="closingEmailRow"></p>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-watermark" aria-hidden="true">
    <img src="assets/logos-detalhe/detalhe-5.svg" alt="">
  </div>
  <div class="wrap footer-grid">
    <div class="footer-brand">
      <img src="assets/logos-detalhe/logo-branco.svg" alt="ORLANDO Marketing &amp; Branding" class="footer-mark-img">
      <p id="footerTagline"></p>
    </div>
    <nav class="footer-nav" id="footerNav" aria-label="Navegação do rodapé"></nav>
    <div class="footer-contact">
      <a id="footerEmail"></a>
      <a id="footerWhatsapp" target="_blank" rel="noopener"></a>
      <div class="footer-social" id="footerSocial" aria-label="Redes sociais da ORLANDO"></div>
    </div>
  </div>
  <div class="wrap footer-bottom">
    <span>© <span id="footerYear"></span> ORLANDO</span>
    <nav class="footer-legal" id="footerLegal" aria-label="Links legais"></nav>
  </div>
</footer>

<script src="cms-client.js"></script>
<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
